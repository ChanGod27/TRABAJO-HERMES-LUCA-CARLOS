<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>go_tasks - Iniciar Sesión</title>
  <!-- Google Fonts: Caveat & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Hoja de estilos CSS nativa -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Contenedor Centrado de Login -->
  <main class="login-wrapper">
    <div class="login-card">
      
      <!-- Cabecera del Login -->
      <header class="login-header">
        <h1 class="login-logo brand-glow">go_tasks</h1>
        <p class="login-subtitle">Ingresa a tu cuenta para continuar</p>
      </header>

      <!-- Formulario de Inicio de Sesión -->
      <form action="/usuarios/login" method="POST" class="login-form">
        <!-- Campo Email -->
        <div class="form-group">
          <label for="login-email" class="form-label">
            Correo Electrónico <span class="req-star">*</span>
          </label>
          <input 
            type="email" 
            id="login-email" 
            name="email" 
            required 
            placeholder="correo@ejemplo.com" 
            class="form-control"
            autocomplete="email"
          >
        </div>

        <!-- Campo Contraseña -->
        <div class="form-group">
          <label for="login-password" class="form-label">
            Contraseña <span class="req-star">*</span>
          </label>
          <input 
            type="password" 
            id="login-password" 
            name="contrasena" 
            required 
            placeholder="••••••••••••" 
            class="form-control"
            autocomplete="current-password"
          >
        </div>

        <!-- Botón de Envío -->
        <button type="submit" class="btn btn-primary login-btn-submit">
          <i class="fa-solid fa-arrow-right-to-bracket"></i>
          <span>Iniciar Sesión</span>
        </button>
      </form>

      <!-- Enlaces Inferiores -->
      <footer class="login-footer">
        <p>¿No tienes cuenta? <a href="usuarios.html" class="login-link">Regístrate aquí</a></p>
        <p style="margin-top: 0.5rem; font-size: 0.75rem; color: var(--color-text-dim);">
          <a href="usuarios.html" class="login-link" style="color: var(--color-text-muted);">
            <i class="fa-solid fa-users"></i> Seleccionar usuario existente
          </a>
        </p>
      </footer>

    </div>
  </main>

</body>
</html>
